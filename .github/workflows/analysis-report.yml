name: Analysis report

# Runs the analysis against the production DB and commits analysis/output/,
# the run notebook and fresh README screenshots.
#
# Needs a DATABASE_URL repo secret. On Supabase use the pooler URL, the
# direct db.*.supabase.co host is IPv6 only and GitHub runners aren't.
# Only reads data, apart from (re)creating the analytics views.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days (0 = all time)"
        default: "30"
  schedule:
    - cron: "17 3 * * 1" # Monday mornings, after the 01:00 ingest

permissions:
  contents: write

concurrency:
  group: analysis-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANALYSIS_DAYS: ${{ inputs.days || '30' }}

    steps:
      - uses: actions/checkout@v4

      - name: Require the DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - run: pip install -r analysis/requirements.txt nbconvert ipykernel

      - name: Run report
        run: python analysis/report.py --install-views --days "$ANALYSIS_DAYS"

      - name: Run notebook
        run: jupyter nbconvert --to notebook --execute --inplace analysis/bharat_lens_coverage.ipynb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Screenshots
        run: |
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/insights > /dev/null && break
            sleep 2
          done
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node .github/scripts/screenshots.mjs || { cat /tmp/next.log; exit 1; }

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output analysis/bharat_lens_coverage.ipynb docs/screenshots
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update analysis output ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
